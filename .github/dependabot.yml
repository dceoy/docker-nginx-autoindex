---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      docker-dependencies:
        patterns:
          - '*'
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      docker-compose-dependencies:
        patterns:
          - '*'
